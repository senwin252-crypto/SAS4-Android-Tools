      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          if [ "$PROJECT_DIR" = "." ] || [ -z "$PROJECT_DIR" ]; then
            echo "File settings.gradle tidak ditemukan"
            find project -maxdepth 4 -type f
            exit 1
          fi
          echo "Project directory: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug
